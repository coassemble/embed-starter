# Proposal only. Install in coassemble-author/.github/workflows AFTER approval.
name: Embed starter after product release

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

jobs:
  sandbox-browser-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'main - coassemble-frontend-prod' ||
      github.event.deployment.environment == 'main - coassemble-backend-prod'))
    runs-on: ubuntu-latest
    environment: embed-starter-sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          repository: coassemble/embed-starter
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the latest successful production deployment pair
        id: release
        run: node ci-proposals/release-ready.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
        if: steps.release.outputs.ready == 'true'
      - run: npm test
        if: steps.release.outputs.ready == 'true'
      - run: npm ci --prefix ci-proposals
        if: steps.release.outputs.ready == 'true'
      - run: npm exec --prefix ci-proposals -- playwright install --with-deps chromium
        if: steps.release.outputs.ready == 'true'
      - run: npm run smoke --prefix ci-proposals
        if: steps.release.outputs.ready == 'true'
        env:
          COASSEMBLE_KEY: ${{ secrets.EMBED_STARTER_SANDBOX_KEY }}
          COASSEMBLE_IDENTIFIER: embed-starter-release-smoke
          COASSEMBLE_API_BASE: ${{ steps.release.outputs.api_base }}
          OPEN_BROWSER: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embed-starter-${{ steps.release.outputs.sha || github.run_id }}
          path: |
            release-receipt.json
            test-results/
            ci-proposals/test-results/
